# Nieuwsbronnen.
# soort: rss (gewone feed) of google_news (zoekopdracht via Google News)
# volledige_tekst: true = het artikel is vrij leesbaar, de agent haalt de hele tekst op
# gewicht: 3 = basisbron, 2 = belangrijk, 1 = aanvullend
# Controleer met de workflow "Feeds controleren" welke bronnen werken.

bronnen:
